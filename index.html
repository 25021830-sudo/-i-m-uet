<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Nhân Sự Tốc Độ Cao</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --primary-color: #2c3e50;
            --table-header: #34495e;
            --table-striped: #f9f9f9;
        }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            font-size: 16px;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .backup-panel {
            background: #fff3cd;
            color: #856404;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid #ffeeba;
            font-size: 14px;
            margin-bottom: 15px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        th, td {
            border: 1px solid var(--border-color);
            padding: 10px 12px;
            text-align: left;
            font-size: 14px;
        }
        th {
            background-color: var(--table-header);
            color: white;
            position: sticky;
            top: 0;
        }
        tr:nth-child(even) {
            background-color: var(--table-striped);
        }
        .status {
            text-align: center;
            padding: 20px;
            font-size: 16px;
            color: #666;
            font-weight: 500;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Cổng Tra Cứu Thông Tin Nội Bộ (Tối Ưu Tốc Độ)</h2>
    
    <input type="text" id="search_input" class="search-box" placeholder="Nhập từ khóa bất kỳ để tìm kiếm ngay..." />
    
    <div class="backup-panel" id="upload_panel">
        📁 <b>Dự phòng:</b> Nếu hệ thống chưa tải được file tự động từ server, hãy chọn file Excel từ máy tính: 
        <input type="file" id="excel_file_input" accept=".xlsx, .xls" style="margin-left: 10px;" />
    </div>
    
    <div id="status_message" class="status">🔄 Đang tải file dữ liệu ngầm từ đám mây...</div>

    <div style="overflow-x: auto; max-height: 550px;">
        <table id="data_table" style="display: none;">
            <thead id="table_head"></thead>
            <tbody id="table_body"></tbody>
        </table>
    </div>
</div>

<script>
    let masterData = []; 
    let tableHeaders = new Set(); 
    let searchTimeout = null; // Dùng để hoãn tìm kiếm (Debounce) giúp gõ phím mượt hơn

    const searchInput = document.getElementById('search_input');
    const excelFileInput = document.getElementById('excel_file_input');
    const dataTable = document.getElementById('data_table');
    const tableHead = document.getElementById('table_head');
    const tableBody = document.getElementById('table_body');
    const statusMessage = document.getElementById('status_message');

    // -------------------------------------------------------------
    // TẠO THUẬT TOÁN CHẠY NGẦM (WEB WORKER CODE)
    // -------------------------------------------------------------
    const workerCode = function() {
        // Nạp thư viện xlsx vào luồng ngầm
        importScripts('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js');

        self.onmessage = function(e) {
            try {
                const arrayBuffer = e.data;
                const data = new Uint8Array(arrayBuffer);
                // Đọc file với cấu trúc tối giản để tăng tốc độ xử lý phần cứng
                const workbook = XLSX.read(data, { type: 'array', Sheets: [] });
                
                let localMasterData = [];
                let localHeaders = new Set();
                let totalRows = 0;

                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    // Tối ưu chuyển đổi sang JSON nhanh bằng defval trống
                    const sheetJson = XLSX.utils.sheet_to_json(worksheet, { defval: "" });
                    
                    if (sheetJson.length > 0) {
                        totalRows += sheetJson.length;
                        Object.keys(sheetJson[0]).forEach(h => localHeaders.add(h));
                        
                        //
