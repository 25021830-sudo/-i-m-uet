<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Thống Tra Cứu Nhân Sự Toàn Diện</title>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --container-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dddddd;
            --primary-color: #2c3e50;
            --table-header: #34495e;
            --table-striped: #f9f9f9;
        }

        [data-theme="dark"] {
            --bg-color: #121212;
            --container-bg: #1e1e1e;
            --text-color: #e0e0e0;
            --border-color: #333333;
            --primary-color: #2980b9;
            --table-header: #2980b9;
            --table-striped: #2b2b2b;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
            background: var(--container-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }

        .header-box {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--border-color);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        .theme-btn {
            background-color: var(--primary-color);
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .control-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
        }

        .search-box {
            width: 100%;
            padding: 12px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background-color: var(--container-bg);
            color: var(--text-color);
            font-size: 16px;
            box-sizing: border-box;
        }

        .search-box:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .backup-upload {
            background: rgba(0, 0, 0, 0.03);
            padding: 12px;
            border-radius: 8px;
            border: 1px dashed var(--border-color);
            font-size: 14px;
        }

        [data-theme="dark"] .backup-upload {
            background: rgba(255, 255, 255, 0.03);
        }

        .meta-info {
            font-size: 14px;
            margin-bottom: 15px;
            color: #666;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            border: 1px solid var(--border-color);
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: var(--table-header);
            color: white;
            position: sticky;
            top: 0;
        }

        tr:nth-child(even) {
            background-color: var(--table-striped);
        }

        .status {
            text-align: center;
            padding: 40px;
            font-size: 18px;
            color: #888;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-box">
        <h2>Cổng Tra Cứu Thông Tin Nội Bộ</h2>
        <button class="theme-btn" id="themeToggle">Chế độ Tối 🌙</button>
    </div>

    <div class="control-panel">
        <input type="text" id="search_input" class="search-box" placeholder="Nhập từ khóa bất kỳ (Tên, Mã số, Phòng ban...) để tìm kiếm..." disabled />
        
        <div class="backup-upload" id="upload_panel">
            💡 <b>Mẹo chạy thử dưới máy:</b> Nếu chưa
